[workspace]
resolver = "3"
members = [
    "crates/yori-diff",
    "crates/yori-document",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/trixnz/yori"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
